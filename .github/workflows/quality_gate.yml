name: Quality Gate & Regression Tests

on:
  push:
    branches: [ master, main ]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'PROJECT_NOW.md'
      - '.github/workflows/**'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'PROJECT_NOW.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx

      - name: Workspace Configuration Gate
        run: |
          python scripts/check_workspace_config.py

      - name: Academic Workflow Regression Tests
        run: |
          python tests/test_academic_workflow.py

      - name: Document Quality Gate (Conditional)
        run: |
          python -c "
          import sys
          from pathlib import Path
          from scripts.check_academic_quality import find_default_targets, run_quality_check
          root = Path('.').resolve()
          targets = find_default_targets(root)
          if targets:
              res = run_quality_check(project_root=root)
              print(f'Checked {len(res.scanned_files)} files. Status: {res.status}')
              sys.exit(res.exit_code)
          else:
              print('No active drafts detected, skipping document quality gate without false failure.')
          "
